<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply to listing</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f3f3f1; --accent:#1f6feb; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121212; --fg:#eee; --muted:#9a9a9a; --card:#1f1f1f; --accent:#4c8dff; --ok:#3fb950; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--fg);
         font:16px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 16px; word-break:break-word; }
  .open { display:block; text-align:center; background:var(--accent); color:#fff; text-decoration:none;
          padding:14px; border-radius:10px; font-weight:600; margin-bottom:20px; }
  .msg { width:100%; text-align:left; background:var(--card); color:var(--fg); border:2px solid transparent;
         border-radius:10px; padding:14px; margin-bottom:10px; font:inherit; cursor:pointer; }
  .msg b { display:block; margin-bottom:4px; }
  .msg span { color:var(--muted); font-size:14px; white-space:pre-wrap; }
  .msg.done { border-color:var(--ok); }
  #status { color:var(--ok); min-height:1.5em; font-weight:600; }
</style>
</head>
<body>
  <h1>Reply to this listing</h1>
  <p class="sub" id="title"></p>
  <a class="open" id="open" href="#" target="_blank" rel="noopener">Open listing</a>
  <p>Tap a message to copy it, then tap <em>Reply</em> on the listing and paste.</p>
  <p id="status"></p>
  <div id="list"></div>

<script>
  // ---- EDIT THESE ----
  const MY_NAME = "Simrun Mutha";
  const MESSAGES = [
    { label: "room + social",
      text: "Hi! I'm super interested in the room you have available! Could we schedule a time for a virtual tour/chat? My number is 3142014145. A little bit about me- I'm Simrun (26f) and I'm moving to San Francisco from Boston for a new job at a startup based in Bayview working on collision detection technology for buses as a software engineer. I will be working in-person 9-5 at least 4 days a week with one day optionally remote. I generally like maintaining a super clean space and don't have any pets. I usually wake up around 8am and sleep around 11pm.  I typically cook 2-3 days a week. I am generally easy going and like having a social vibe with roommates! I've been living with roommates for the past three years and have always been good friends with them, would be happy to provide references! Things I'd love to do with roomies are pizza night, watch survivor, or bike to ice cream shops together! In my free time, I like to rock climb, cook with friends, read, play board games. Recently, I have been trying to learn Spanish. I'm super excited to explore a new city!" },
    { label: "room + private",
      text: "Hi!. I'm super interested in the room you have available! Could we schedule a time for a virtual tour/chat? My number is 3142014145. A little bit about me- I'm Simrun (26f) and I'm moving to San Francisco from Boston for a new job at a startup based in Bayview working on collision detection technology for buses as a software engineer. I will be working in-person 9-5 at least 4 days a week with one day optionally remote. I generally like maintaining a super clean space, don't plan on hosting parties and don't have any pets. I typically cook 2-3 days a week and generally sleep regular hours from 10pm- 7am. Looking forward to hearing from you!"
    }
  ];
  // --------------------

  const params = new URLSearchParams(location.search);
  const url = params.get("u") || "";
  const title = params.get("t") || "your listing";

  document.getElementById("title").textContent = title;
  const openLink = document.getElementById("open");
  if (/^https:\/\/[a-z0-9.-]*craigslist\.org\//i.test(url)) openLink.href = url;
  else openLink.style.display = "none";

  const status = document.getElementById("status");
  const list = document.getElementById("list");

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    }
  }

  MESSAGES.forEach(m => {
    const filled = m.text.replaceAll("{title}", title).replaceAll("{name}", MY_NAME);
    const btn = document.createElement("button");
    btn.className = "msg";
    const b = document.createElement("b"); b.textContent = m.label;
    const s = document.createElement("span"); s.textContent = filled;
    btn.append(b, s);
    btn.onclick = async () => {
      document.querySelectorAll(".msg").forEach(x => x.classList.remove("done"));
      const ok = await copy(filled);
      if (ok) btn.classList.add("done");
      status.textContent = ok ? "Copied. Now open the listing and paste." : "Couldn’t copy. Long-press the text instead.";
    };
    list.appendChild(btn);
  });
</script>
</body>
</html>
